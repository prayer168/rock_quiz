<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>五年級岩石與礦物和生活｜互動闖關遊戲</title>
  <style>
    :root{
      --bg1:#eef6ff;
      --bg2:#f8fbff;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --primary:#2563eb;
      --primary2:#1d4ed8;
      --accent:#0ea5e9;
      --ok:#16a34a;
      --bad:#dc2626;
      --line:#dbe4ee;
      --shadow:0 14px 34px rgba(37,99,235,.12);
      --radius:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
      color:var(--text);
      background:linear-gradient(180deg,var(--bg1),var(--bg2));
      min-height:100vh;
    }
    .wrap{max-width:980px;margin:0 auto;padding:22px 16px 40px}
    .screen{display:none}
    .screen.show{display:block}
    .hero{
      background:linear-gradient(135deg,var(--primary2),var(--accent));
      color:#fff;border-radius:28px;padding:32px 24px;box-shadow:var(--shadow);
      overflow:hidden;position:relative
    }
    .hero:before,.hero:after{
      content:"";position:absolute;border-radius:999px;background:rgba(255,255,255,.15)
    }
    .hero:before{width:180px;height:180px;right:-40px;top:-40px}
    .hero:after{width:120px;height:120px;left:-20px;bottom:-20px}
    .hero h1{margin:0 0 10px;font-size:2rem;line-height:1.3;position:relative}
    .hero p{margin:0;line-height:1.8;max-width:760px;position:relative}
    .hero .rocks{font-size:2.2rem;margin-bottom:14px;position:relative}

    .panel{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:24px;margin-top:18px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
    .mini{background:#f8fbff;border:1px solid var(--line);border-radius:18px;padding:14px}
    .mini .t{font-size:.9rem;color:var(--muted);margin-bottom:6px}
    .mini .v{font-size:1.08rem;font-weight:700;line-height:1.6}
    .start-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}

    .btn{
      border:none;border-radius:16px;padding:13px 20px;font-size:1rem;font-weight:700;cursor:pointer;
      transition:.2s ease;box-shadow:0 6px 16px rgba(0,0,0,.05)
    }
    .btn:hover{transform:translateY(-1px)}
    .btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
    .btn.secondary{background:#e5e7eb;color:#111827}
    .btn.ghost{background:#eff6ff;color:var(--primary)}
    .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}

    .topbar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
    .stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
    .stat .label{font-size:.88rem;color:var(--muted);margin-bottom:6px}
    .stat .value{font-size:1.12rem;font-weight:700}
    .progress{height:14px;background:#e7eef8;border-radius:999px;overflow:hidden;margin-bottom:18px}
    .bar{height:100%;width:0;background:linear-gradient(90deg,var(--primary),#60a5fa);transition:width .35s ease}

    .quiz-card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:var(--shadow)}
    .tag{display:inline-block;background:#dbeafe;color:var(--primary);padding:6px 12px;border-radius:999px;font-size:.92rem;font-weight:700;margin-bottom:14px}
    .question{font-size:1.35rem;font-weight:800;line-height:1.7;margin-bottom:18px}
    .choices{display:grid;gap:12px}
    .choice{
      width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:18px;padding:15px 16px;
      font-size:1rem;line-height:1.7;cursor:pointer;transition:.2s ease
    }
    .choice:hover:not(:disabled){border-color:#93c5fd;transform:translateY(-1px)}
    .choice.correct{border-color:#86efac;background:#f0fdf4;color:#166534}
    .choice.wrong{border-color:#fca5a5;background:#fef2f2;color:#991b1b}
    .choice.reveal{border-color:#86efac;background:#f0fdf4}
    .feedback{display:none;margin-top:16px;border-radius:18px;padding:14px 16px;line-height:1.8}
    .feedback.show{display:block}
    .feedback.correct{background:#ecfdf5;border:1px solid #bbf7d0;color:#166534}
    .feedback.wrong{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
    .actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}

    .result-top{text-align:center}
    .medal{font-size:3rem;margin-bottom:10px}
    .big-score{font-size:3.2rem;font-weight:900;color:var(--primary);margin:10px 0}
    .summary{color:var(--muted);line-height:1.8;max-width:700px;margin:0 auto 20px}
    .review{display:grid;gap:12px;margin-top:22px}
    .review-item{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fafcff;line-height:1.8}
    .ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}

    .footer-note{margin-top:14px;font-size:.92rem;color:var(--muted)}

    @media (max-width:768px){
      .grid,.topbar{grid-template-columns:1fr}
      .hero h1{font-size:1.55rem}
      .question{font-size:1.15rem}
      .panel,.quiz-card{padding:18px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="screen show" id="startScreen">
      <div class="hero">
        <div class="rocks">🪨💎🏔️</div>
        <h1>五年級岩石與礦物和生活<br>互動闖關遊戲</h1>
        <p>這是一個適合國小五年級的自然科小遊戲，內容包含岩石與礦物的基本概念、特徵辨識、生活應用，以及珍惜地球資源的重要觀念。</p>
      </div>

      <div class="panel">
        <div class="grid">
          <div class="mini">
            <div class="t">題目數量</div>
            <div class="v">20 題選擇題</div>
          </div>
          <div class="mini">
            <div class="t">適用情境</div>
            <div class="v">課堂練習、作業複習、GitHub Pages</div>
          </div>
          <div class="mini">
            <div class="t">遊戲特色</div>
            <div class="v">即時回饋、音效提示、完成總結</div>
          </div>
        </div>
        <div class="start-actions">
          <button class="btn primary" id="startBtn">開始遊戲</button>
          <button class="btn ghost" id="toggleSoundBtn">音效：開啟</button>
        </div>
        <div class="footer-note">提示：若放到 GitHub Pages，只要將這個檔案命名為 <strong>index.html</strong> 即可直接部署。</div>
      </div>
    </section>

    <section class="screen" id="quizScreen">
      <div class="topbar">
        <div class="stat"><div class="label">目前題號</div><div class="value" id="currentNo">1 / 20</div></div>
        <div class="stat"><div class="label">目前得分</div><div class="value" id="scoreNow">0 分</div></div>
        <div class="stat"><div class="label">本題狀態</div><div class="value" id="stateNow">尚未作答</div></div>
        <div class="stat"><div class="label">主題</div><div class="value">岩石、礦物與生活</div></div>
      </div>
      <div class="progress"><div class="bar" id="progressBar"></div></div>
      <div class="quiz-card">
        <div class="tag">自然科闖關</div>
        <div class="question" id="questionText"></div>
        <div class="choices" id="choicesBox"></div>
        <div class="feedback" id="feedbackBox"></div>
        <div class="actions">
          <button class="btn secondary" id="prevBtn">上一題</button>
          <button class="btn primary" id="nextBtn" disabled>下一題</button>
        </div>
      </div>
    </section>

    <section class="screen" id="resultScreen">
      <div class="panel">
        <div class="result-top">
          <div class="medal" id="medal">🎉</div>
          <h2>闖關完成！</h2>
          <div class="big-score" id="finalScore">0 / 20</div>
          <div class="summary" id="summaryText"></div>
          <div class="start-actions" style="justify-content:center;">
            <button class="btn primary" id="restartBtn">再玩一次</button>
            <button class="btn ghost" id="backHomeBtn">回到首頁</button>
          </div>
        </div>
        <div class="review" id="reviewBox"></div>
      </div>
    </section>
  </div>

  <script>
    const quizData = [
      {question:'下列哪一項最符合「礦物」的意思？',choices:['天然形成、成分較固定的物質','人造的塑膠材料','所有會發亮的石頭','土壤中的所有小顆粒'],answer:0,hint:'礦物通常是天然形成，而且有一定的性質。'},
      {question:'下列哪一項最符合「岩石」的意思？',choices:['只由一種礦物組成的東西','由一種或多種礦物組成的固體','所有泥土都算岩石','只有山上才有岩石'],answer:1,hint:'岩石可以由多種礦物組成。'},
      {question:'花岡岩通常由多種礦物組成，所以下列哪個說法正確？',choices:['花岡岩是一種礦物','花岡岩是一種岩石','花岡岩是金屬','花岡岩是土壤'],answer:1,hint:'想想看：由多種礦物組成的是什麼？'},
      {question:'觀察岩石時，最適合先注意哪一項特徵？',choices:['顏色和顆粒粗細','價格高低','是不是最新發現','是不是在國外找到'],answer:0,hint:'外觀是最容易先觀察到的特徵。'},
      {question:'下列哪一項最可能是辨認礦物的線索？',choices:['硬度','手機品牌','購買地點','包裝顏色'],answer:0,hint:'礦物常用硬度、顏色、光澤來辨認。'},
      {question:'石英常被用在手錶、玻璃等製品中，表示礦物和生活有什麼關係？',choices:['礦物和生活沒有關係','礦物常是生活用品的重要材料','礦物只能拿來收藏','礦物只能在課本裡看到'],answer:1,hint:'想想玻璃和電子用品的材料來源。'},
      {question:'下列哪一項最可能含有金屬礦物加工後的材料？',choices:['鋁罐','紙箱','棉布','木筷'],answer:0,hint:'鋁是從礦物中提煉出的金屬。'},
      {question:'大理石常被用來做地板或雕像，主要是因為它',choices:['很容易融化','外觀美麗且可加工','一定比鐵還硬','只能在海邊找到'],answer:1,hint:'想想裝飾建材重視什麼特點。'},
      {question:'下列哪一項是岩石在生活中的用途？',choices:['當作建築材料','當作食物主食','當作空氣來源','當作衣服纖維'],answer:0,hint:'很多房屋、道路會使用岩石材料。'},
      {question:'煤、石油、天然氣雖然和地層有關，但和一般岩石礦物相比，更常被當作什麼？',choices:['能源資源','文具用品','玩具材料','飲用水'],answer:0,hint:'它們最常被拿來提供熱能或動力。'},
      {question:'下列哪個方法較適合安全觀察礦物光澤？',choices:['用眼睛在光線下觀察表面反光','直接放入口中試味道','用力敲碎到飛散','拿去火上燒'],answer:0,hint:'安全第一，先用觀察的方法。'},
      {question:'岩石慢慢碎裂變成更小顆粒，最後可能形成什麼？',choices:['土壤的一部分','閃電','彩虹','塑膠'],answer:0,hint:'岩石風化後會變成較細小的顆粒。'},
      {question:'下列哪一項最能說明保護礦產資源的重要性？',choices:['礦產資源取之不盡','礦產形成需要很長時間','每個人家裡都能挖到','用完還會立刻長回來'],answer:1,hint:'想想礦物形成的時間長短。'},
      {question:'我們使用鉛筆時，筆芯中的石墨屬於哪一類？',choices:['礦物','塑膠','木材','液體'],answer:0,hint:'石墨是天然礦物的一種。'},
      {question:'下列哪一種物品和石灰岩關係最密切？',choices:['水泥','橡皮擦','毛衣','玻璃杯'],answer:0,hint:'石灰岩是製造水泥的重要原料之一。'},
      {question:'若一塊岩石裡可以看到不同顏色和大小的顆粒，表示它',choices:['可能由不同礦物組成','一定是塑膠做的','不是天然形成的','不能當岩石'],answer:0,hint:'不同顆粒常代表不同成分。'},
      {question:'下列哪個例子最能說明礦物就在我們身邊？',choices:['手機、玻璃、建築物都可能用到礦物','只有火山口才找得到礦物','礦物只存在博物館','礦物和日常生活完全無關'],answer:0,hint:'想想日常用品的材料來源。'},
      {question:'要比較兩種礦物誰比較硬，較合理的方法是',choices:['觀察哪個比較重','用刮痕測試比較','看哪個比較大','看哪個比較亮'],answer:1,hint:'硬度常用互相刻劃的方式比較。'},
      {question:'下列哪一項是愛護地球資源的做法？',choices:['回收金屬製品再利用','把還能用的東西全部丟掉','一直浪費電力','隨意開採不管理'],answer:0,hint:'資源回收能減少新礦產的消耗。'},
      {question:'學習岩石與礦物和生活的關係，最主要的目的是什麼？',choices:['了解自然資源如何影響生活並學會珍惜','只為了考試背名字','知道石頭哪個最貴','分辨哪個石頭最重'],answer:0,hint:'重點是認識用途與珍惜資源。'}
    ];

    let current = 0;
    let score = 0;
    let selected = Array(quizData.length).fill(null);
    let locked = Array(quizData.length).fill(false);
    let soundEnabled = true;

    const startScreen = document.getElementById('startScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const startBtn = document.getElementById('startBtn');
    const toggleSoundBtn = document.getElementById('toggleSoundBtn');
    const currentNo = document.getElementById('currentNo');
    const scoreNow = document.getElementById('scoreNow');
    const stateNow = document.getElementById('stateNow');
    const progressBar = document.getElementById('progressBar');
    const questionText = document.getElementById('questionText');
    const choicesBox = document.getElementById('choicesBox');
    const feedbackBox = document.getElementById('feedbackBox');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const finalScore = document.getElementById('finalScore');
    const summaryText = document.getElementById('summaryText');
    const medal = document.getElementById('medal');
    const reviewBox = document.getElementById('reviewBox');
    const restartBtn = document.getElementById('restartBtn');
    const backHomeBtn = document.getElementById('backHomeBtn');

    function showScreen(name){
      startScreen.classList.remove('show');
      quizScreen.classList.remove('show');
      resultScreen.classList.remove('show');
      if(name==='start') startScreen.classList.add('show');
      if(name==='quiz') quizScreen.classList.add('show');
      if(name==='result') resultScreen.classList.add('show');
    }

    function playTone(freq, duration, type='sine', gain=0.04){
      if(!soundEnabled) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if(!AudioContextClass) return;
      const ctx = new AudioContextClass();
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      g.gain.value = gain;
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start();
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration / 1000);
      osc.stop(ctx.currentTime + duration / 1000);
      setTimeout(()=>ctx.close(), duration + 120);
    }

    function soundCorrect(){ playTone(660,180,'sine',0.05); setTimeout(()=>playTone(880,220,'sine',0.05),90); }
    function soundWrong(){ playTone(240,220,'square',0.045); setTimeout(()=>playTone(170,260,'square',0.04),100); }
    function soundStart(){ playTone(523,120,'triangle',0.04); setTimeout(()=>playTone(659,120,'triangle',0.04),90); setTimeout(()=>playTone(784,180,'triangle',0.04),180); }
    function soundFinish(){ playTone(523,120,'triangle',0.04); setTimeout(()=>playTone(659,120,'triangle',0.04),90); setTimeout(()=>playTone(784,120,'triangle',0.04),180); setTimeout(()=>playTone(1046,260,'triangle',0.045),280); }

    function updateHeader(){
      currentNo.textContent = `${current + 1} / ${quizData.length}`;
      scoreNow.textContent = `${score} 分`;
      stateNow.textContent = locked[current] ? '已作答' : '尚未作答';
      progressBar.style.width = `${(current / quizData.length) * 100}%`;
    }

    function renderQuestion(){
      updateHeader();
      const item = quizData[current];
      questionText.textContent = item.question;
      choicesBox.innerHTML = '';
      feedbackBox.className = 'feedback';
      feedbackBox.textContent = '';

      item.choices.forEach((choice, index)=>{
        const btn = document.createElement('button');
        btn.className = 'choice';
        btn.disabled = locked[current];
        btn.textContent = `${String.fromCharCode(65 + index)}. ${choice}`;

        if(locked[current]){
          if(index === item.answer) btn.classList.add('reveal');
          if(selected[current] === index && index === item.answer) btn.classList.add('correct');
          if(selected[current] === index && index !== item.answer) btn.classList.add('wrong');
        }

        btn.addEventListener('click', ()=>checkAnswer(index));
        choicesBox.appendChild(btn);
      });

      prevBtn.disabled = current === 0;
      nextBtn.disabled = !locked[current];

      if(locked[current]){
        const ok = selected[current] === item.answer;
        feedbackBox.className = `feedback show ${ok ? 'correct' : 'wrong'}`;
        feedbackBox.innerHTML = ok
          ? `答對了！${item.hint}`
          : `答錯了。正確答案是「${String.fromCharCode(65 + item.answer)}. ${item.choices[item.answer]}」。${item.hint}`;
      }
    }

    function checkAnswer(index){
      if(locked[current]) return;
      selected[current] = index;
      locked[current] = true;
      if(index === quizData[current].answer){ score += 1; soundCorrect(); }
      else{ soundWrong(); }
      renderQuestion();
    }

    function buildResult(){
      progressBar.style.width = '100%';
      finalScore.textContent = `${score} / ${quizData.length}`;
      let msg = '持續加油，再玩一次會更熟練！';
      medal.textContent = '🌱';
      if(score >= 18){ msg = '太棒了！你已經很熟悉岩石、礦物和生活之間的關係。'; medal.textContent = '🏆'; }
      else if(score >= 14){ msg = '表現很好！大部分重點都掌握住了。'; medal.textContent = '🥇'; }
      else if(score >= 10){ msg = '不錯喔！再複習幾個概念就更完整了。'; medal.textContent = '👏'; }
      summaryText.textContent = `你答對 ${score} 題，答錯 ${quizData.length - score} 題。${msg}`;
      reviewBox.innerHTML = '';
      quizData.forEach((item,i)=>{
        const correct = selected[i] === item.answer;
        const div = document.createElement('div');
        div.className = 'review-item';
        div.innerHTML = `
          <strong>第 ${i+1} 題：${item.question}</strong><br>
          <span class="${correct ? 'ok' : 'bad'}">${correct ? '答對' : '答錯'}</span><br>
          你的答案：${selected[i]===null ? '未作答' : item.choices[selected[i]]}<br>
          正確答案：${item.choices[item.answer]}
        `;
        reviewBox.appendChild(div);
      });
    }

    function resetQuiz(){
      current = 0; score = 0;
      selected = Array(quizData.length).fill(null);
      locked = Array(quizData.length).fill(false);
      renderQuestion();
    }

    startBtn.addEventListener('click', ()=>{
      soundStart();
      resetQuiz();
      showScreen('quiz');
    });

    toggleSoundBtn.addEventListener('click', ()=>{
      soundEnabled = !soundEnabled;
      toggleSoundBtn.textContent = `音效：${soundEnabled ? '開啟' : '關閉'}`;
    });

    prevBtn.addEventListener('click', ()=>{
      if(current > 0){ current -= 1; renderQuestion(); }
    });

    nextBtn.addEventListener('click', ()=>{
      if(!locked[current]) return;
      if(current < quizData.length - 1){ current += 1; renderQuestion(); }
      else{
        soundFinish();
        buildResult();
        showScreen('result');
      }
    });

    restartBtn.addEventListener('click', ()=>{
      soundStart();
      resetQuiz();
      showScreen('quiz');
    });

    backHomeBtn.addEventListener('click', ()=>showScreen('start'));
  </script>
</body>
</html>
